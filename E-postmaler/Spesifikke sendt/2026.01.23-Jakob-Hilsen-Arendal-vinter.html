        /* ===== SNØ – tettere og litt langsommere ===== */
        .snow-wrapper {
            position: relative;
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }

        .snow-particle {
            position: absolute;
            top: -60px;
            z-index: 5;
            background-color: #dcdcdc;
            border-radius: 50%;
            opacity: 0.5;
            filter: blur(0.7px);
            pointer-events: none;
            animation-name: snowFall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        /* Fall hele veien ned til under sjøen */
        @keyframes snowFall {
            0%   { transform: translateY(-60px); opacity: 0; }
            10%  { opacity: 0.7; }
            100% { transform: translateY(4000px); opacity: 0; }
        }

        .snow-particle.small  { width: 2px; height: 2px; }
        .snow-particle.medium { width: 3px; height: 3px; }
        .snow-particle.large  { width: 4px; height: 4px; }

        /* Litt langsommere enn sist */
        .slow    { animation-duration: 9s; }
        .mediums { animation-duration: 8s; }
        .fast    { animation-duration: 7s; }
        .faster  { animation-duration: 6s; }
