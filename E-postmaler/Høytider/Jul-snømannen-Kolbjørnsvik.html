            mso-table-rspace: 0pt !important;

        }

        img,

            border: 0;
            outline: none;
            text-decoration: none;
        }

        table {
            border-spacing: 0 !important;
            border-collapse: collapse !important;
            table-layout: fixed !important;
            margin: 0 auto !important;
        }

        img {
            -ms-interpolation-mode: bicubic;
            border: 0;
            height: auto;
            line-height: 100%;
            outline: none;
            text-decoration: none;
        }

            padding: 0;

        .ReadMsgBody {

        .ExternalClass {

        .ExternalClass,
        .ExternalClass p,
        .ExternalClass span,
        .ExternalClass font,
        .ExternalClass td,
        .ExternalClass div {
            line-height: 100%;
        }

        /* SNØKRYSTALL-ANIMASJON – tettere og mer diskret */
        @media screen and (-webkit-min-device-pixel-ratio: 0) {
            .snow-wrapper {
                position: relative;
                width: 100%;
                max-width: 100%;
                margin: 0 auto;
                overflow: hidden;
            }

            .snowflake {
                position: absolute;
                top: -10%;
                z-index: 5;
                color: #e0e0e0; /* lys grå i stedet for ren hvit */
                opacity: 0.7;  /* mattere snø */
                font-size: 14px; /* litt mindre krystaller */
                font-family: Arial, sans-serif;
                text-shadow: 0 0 3px rgba(0,0,0,0.25); /* svakere skygge */
                pointer-events: none;
                -webkit-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
                animation-name: snowflakes-fall, snowflakes-shake;
                animation-duration: 12s, 4s; /* roligere fall og saktere svaing */
                animation-timing-function: linear, ease-in-out;
                animation-iteration-count: infinite, infinite;
                animation-play-state: running, running;
            }

            @keyframes snowflakes-fall {
                0%   { top: -10%; }
                100% { top: 110%; }
            }

            @keyframes snowflakes-shake {
                0%   { transform: translateX(0px); }
                50%  { transform: translateX(20px); }
                100% { transform: translateX(0px); }
            }

            /* Tettere snø – flere nth-of-type med ulike posisjoner/delay */
            .snowflake:nth-of-type(1)  { left: 3%;   animation-delay: 0s,   0s;   }
            .snowflake:nth-of-type(2)  { left: 10%;  animation-delay: 2s,   1s;   }
            .snowflake:nth-of-type(3)  { left: 17%;  animation-delay: 4s,   0.5s; }
            .snowflake:nth-of-type(4)  { left: 24%;  animation-delay: 1s,   2s;   }
            .snowflake:nth-of-type(5)  { left: 31%;  animation-delay: 5s,   1.5s; }
            .snowflake:nth-of-type(6)  { left: 38%;  animation-delay: 3s,   2.5s; }
            .snowflake:nth-of-type(7)  { left: 45%;  animation-delay: 6s,   0.7s; }
            .snowflake:nth-of-type(8)  { left: 52%;  animation-delay: 8s,   1.8s; }
            .snowflake:nth-of-type(9)  { left: 59%;  animation-delay: 2.5s, 0.3s; }
            .snowflake:nth-of-type(10) { left: 66%;  animation-delay: 7s,   1.2s; }
            .snowflake:nth-of-type(11) { left: 73%;  animation-delay: 3.5s, 2.2s; }
            .snowflake:nth-of-type(12) { left: 80%;  animation-delay: 9s,   0.9s; }
            .snowflake:nth-of-type(13) { left: 87%;  animation-delay: 4.8s, 1.7s; }
            .snowflake:nth-of-type(14) { left: 94%;  animation-delay: 6.2s, 0.4s; }
            .snowflake:nth-of-type(15) { left: 50%;  animation-delay: 10s,  2.8s; }
            .snowflake:nth-of-type(16) { left: 20%;  animation-delay: 11s,  1.9s; }
            .snowflake:nth-of-type(17) { left: 40%;  animation-delay: 7.5s, 0.6s; }
            .snowflake:nth-of-type(18) { left: 60%;  animation-delay: 5.5s, 2.4s; }
            .snowflake:nth-of-type(19) { left: 30%;  animation-delay: 8.5s, 1.3s; }
            .snowflake:nth-of-type(20) { left: 70%;  animation-delay: 9.5s, 0.2s; }
        }
