<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCQ-30 (Voice Hearing)</title>
    
    <!-- PDF & Word Export Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e74c3c;
            --bg: #f4f7f6;
            --paper: #ffffff;
            --border: #dcdde1;
        }

        body {
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: #333;
            margin: 0;
            padding: 30px;
            line-height: 1.6;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background-color: var(--paper);
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border-radius: 8px;
        }

        h1 { color: var(--primary); text-align: center; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; font-weight: 300; }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #fafafa;
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .form-group label { display: block; font-size: 12px; font-weight: bold; color: #7f8c8d; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }

        /* Legend */
        .legend-box {
            background: #e8f4fd;
            padding: 15px;
            border-left: 4px solid var(--secondary);
            margin-bottom: 30px;
            border-radius: 4px;
            font-size: 13px;
        }

        /* Question Rows */
        .q-row {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 15px;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px dotted #eee;
        }

        .q-text { font-weight: 500; }

        /* Scale */
        .scale-container {
            display: flex;
            gap: 2px;
        }
        
        .scale-opt {
            flex: 1;
            text-align: center;
            border: 1px solid #ddd;
            cursor: pointer;
            padding: 8px 0;
            font-size: 14px;
            border-radius: 3px;
        }
        
        .scale-opt:hover { background-color: #f0f0f0; }
        .scale-opt.selected { background-color: var(--secondary); color: white; border-color: var(--secondary); }

        /* Results */
        .results-section {
            margin-top: 40px;
            padding: 25px;
            background: #f8f9fa;
            border: 2px solid var(--primary);
            border-radius: 8px;
            display: none;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }

        .total-val { font-weight: bold; font-size: 24px; color: var(--accent); }

        /* Controls */
        .controls {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 15px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            color: white;
            transition: transform 0.1s;
            font-size: 14px;
        }
        button:hover { transform: translateY(-2px); }
        .btn-calc { background-color: var(--secondary); }
        .btn-word { background-color: #2980b9; }
        .btn-pdf { background-color: #c0392b; }
        .btn-reset { background-color: #95a5a6; }

        @media print {
            .controls { display: none; }
            .container { box-shadow: none; margin: 0; padding: 0; width: 100%; }
        }
    </style>
</head>
<body>

<div class="container" id="doc-content">
    <h1>MCQ-30 (Voice Hearing)</h1>
    <div class="subtitle">Metacognitions Questionnaire for Voice Hearing</div>

    <div class="meta-grid">
        <div class="form-group">
            <label>Navn</label>
            <input type="text" id="pName" placeholder="Navn...">
        </div>
        <div class="form-group">
            <label>Dato</label>
            <input type="date" id="pDate">
        </div>
        <div class="form-group">
            <label>Fødselsdato</label>
            <input type="text" id="pBirth" placeholder="dd.mm.åååå">
        </div>
        <div class="form-group">
            <label>Kjønn</label>
            <input type="text" id="pGender">
        </div>
    </div>

    <div class="legend-box">
        <strong>Skåring:</strong><br>
        1 = Ikke enig<br>
        2 = Litt enig<br>
        3 = Ganske enig<br>
        4 = Svært enig
    </div>

    <div id="questions-container">
        <!-- Generated via JS -->
    </div>

    <div class="results-section" id="results">
        <h3>Resultater</h3>
        
        <div class="score-row" style="border-bottom: 2px solid var(--primary); margin-top:10px;">
            <span><strong>TOTAL SKÅRE</strong> (30-120):</span>
            <span class="total-val" id="res-total">-</span>
        </div>
    </div>

</div>

<div class="controls">
    <button class="btn-calc" onclick="calculateScore()">📊 Beregn</button>
    <button class="btn-word" onclick="exportWord()">💾 Lagre til Word</button>
    <button class="btn-pdf" onclick="exportPDF()" id="pdfBtn">📄 Lagre til PDF</button>
    <button class="btn-reset" onclick="resetForm()">🔄 Nullstill</button>
</div>

<script>
    document.getElementById('pDate').valueAsDate = new Date();

    const questions = [
        "1. Mine stemmer hjelper meg å unngå problemer i fremtiden.",
        "2. At jeg hører stemmer, er farlig for meg.",
        "3. Jeg tenker mye om mine stemmer.",
        "4. Jeg kan bli syk av å høre stemmer.",
        "5. Jeg er oppmerksom på stemmene mine når jeg tenker gjennom et problem.",
        "6. Dersom jeg ikke kontrollerte det stemmene sier, og det så skjedde, ville det være min skyld.",
        "7. Jeg trenger å høre på mine stemmer for å fremdeles være organisert.",
        "8. Det at jeg hører stemmer gjør at jeg ikke husker ting godt nok.",
        "9. Mine stemmer går ikke bort uansett hvordan jeg forsøker å stoppe dem.",
        "10. Å høre på mine stemmer hjelper meg å sortere tankene mine.",
        "11. Jeg kan ikke ignorere mine stemmer.",
        "12. Jeg holder oversikt over stemmene mine.",
        "13. Jeg burde ha kontroll over stemmene mine hele tiden.",
        "14. Min hukommelse kan fra tid til annen villede meg.",
        "15. Mine bekymringer om stemmer kan gjøre meg gal.",
        "16. Jeg er konstant oppmerksom på stemmene mine.",
        "17. Jeg har en dårlig hukommelse.",
        "18. Jeg er oppmerksom på hva som skjer med tankene mine når jeg hører stemmer.",
        "19. Stemmer hjelper meg å holde ut.",
        "20. At jeg ikke er i stand til å kontrollere stemmene mine, er et tegn på svakhet.",
        "21. Når jeg begynner å høre stemmer, kan jeg ikke stoppe dem.",
        "22. Jeg kommer til å straffes for at jeg ikke kontrollerer visse stemmer.",
        "23. Å høre stemmer hjelper meg å løse problemer.",
        "24. Jeg har lite tillit til min hukommelse for steder.",
        "25. Det er ikke bra å høre visse stemmer.",
        "26. Jeg stoler ikke på hukommelsen min.",
        "27. Dersom jeg ikke kunne kontrollere stemmene mine, ville jeg ikke være i stand til å fungere.",
        "28. Jeg trenger å høre stemmer for å arbeide bra.",
        "29. Jeg har lite tillit til min hukommelse for handlinger.",
        "30. Jeg gransker stemmene mine konstant."
    ];

    const container = document.getElementById('questions-container');
    container.innerHTML = '';

    questions.forEach((q, index) => {
        const i = index + 1;
        const row = document.createElement('div');
        row.className = 'q-row';
        
        let scale = `<div class="scale-container">`;
        for(let j=1; j<=4; j++) {
            scale += `<div class="scale-opt" onclick="selectOpt('ans-${i}', ${j}, this)">${j}</div>`;
        }
        scale += `</div><input type="hidden" id="ans-${i}" value="">`;

        row.innerHTML = `
            <div class="q-text">${q}</div>
            <div>${scale}</div>
        `;
        container.appendChild(row);
    });

    // Global selector
    window.selectOpt = function(id, val, el) {
        const parent = el.parentElement;
        parent.querySelectorAll('.scale-opt').forEach(d => d.classList.remove('selected'));
        el.classList.add('selected');
        document.getElementById(id).value = val;
    };

    function calculateScore() {
        let sum = 0;
        let missing = 0;

        for(let i=1; i<=30; i++) {
            const val = document.getElementById(`ans-${i}`).value;
            if(val) sum += parseInt(val);
            else missing++;
        }

        document.getElementById('res-total').innerText = sum;
        document.getElementById('results').style.display = 'block';
        document.getElementById('results').scrollIntoView({ behavior: 'smooth' });

        if(missing > 0) alert(`Obs: Du har ikke besvart ${missing} spørsmål.`);
    }

    function resetForm() {
        if(confirm("Slette data?")) location.reload();
    }

    async function exportPDF() {
        const btn = document.getElementById('pdfBtn');
        btn.innerText = "Genererer...";
        btn.disabled = true;

        const element = document.getElementById('doc-content');
        const name = document.getElementById('pName').value || "Ukjent";

        try {
            const canvas = await html2canvas(element, { scale: 2, useCORS: true, backgroundColor: '#ffffff' });
            const imgData = canvas.toDataURL('image/png');
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            
            const imgWidth = 190;
            const pageHeight = 295;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;
            let heightLeft = imgHeight;
            let position = 10;

            pdf.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
            heightLeft -= (pageHeight - 20);

            while (heightLeft > 0) {
                position = heightLeft - imgHeight + 10;
                pdf.addPage();
                pdf.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
                heightLeft -= (pageHeight - 20);
            }

            pdf.save(`MCQ-30_Voice_${name}.pdf`);
        } catch(e) {
            alert("Feil ved PDF");
        } finally {
            btn.innerText = "📄 Lagre til PDF";
            btn.disabled = false;
        }
    }

    function exportWord() {
        const name = document.getElementById('pName').value || "Ukjent";
        const content = document.getElementById('doc-content').cloneNode(true);
        
        // Transform inputs
        content.querySelectorAll('input[type="text"], input[type="date"]').forEach(inp => {
            const span = document.createElement('span');
            span.innerHTML = inp.value ? `<b>${inp.value}</b>` : "______";
            inp.parentNode.replaceChild(span, inp);
        });

        // Transform Scale Rows
        const rows = content.querySelectorAll('.q-row');
        rows.forEach(row => {
            const hidden = row.querySelector('input[type="hidden"]');
            const val = hidden ? hidden.value : "-";
            const text = row.querySelector('.q-text').innerText;
            
            row.innerHTML = `<div style="padding:5px; border-bottom:1px solid #eee;">
                ${text}: <b>${val}</b>
            </div>`;
        });

        const header = `
            <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
            <head><meta charset='utf-8'><title>MCQ-30 Resultat</title>
            <style>
                body { font-family: Arial; }
            </style>
            </head><body>
        `;
        const footer = "</body></html>";
        const html = header + content.innerHTML + footer;

        const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `MCQ-30_Voice_${name}.doc`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
